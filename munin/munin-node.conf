log_level 4
log_file /var/log/munin/munin-node.log
pid_file /run/munin/munin-node.pid
background 0
setsid 0
user root
group root
ignore_file [\#~]$
ignore_file DEADJOE$
ignore_file \.bak$
ignore_file %$
ignore_file \.dpkg-(tmp|new|old|dist)$
ignore_file \.rpm(save|new)$
ignore_file \.pod$
allow ^127\.0\.0\.1$
host 127.0.0.1
port 4949